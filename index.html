<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Cam">
<title>Pixel Cam</title>
<style>
:root{--bg:#0b0f0b;--panel:#121a12;--ink:#e6f2d2;--dim:#7a8c6a;--accent:#9bbc0f;--edge:#2c3a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#view{display:none;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
#panel{background:var(--panel);border-top:1px solid var(--edge);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:52%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;color:var(--ink);background:#1a241a;border:1px solid var(--edge);padding:8px 10px;border-radius:4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#0f380f;border-color:var(--accent)}
button.rec-on{background:#a02020;border-color:#a02020;color:#fff}
button:disabled{opacity:.4;cursor:default}
#shoot{width:58px;height:58px;border-radius:50%;background:var(--ink);border:4px solid var(--edge);padding:0}
#shoot:active{transform:scale(.94)}
#shoot.frozen{background:var(--accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dim{color:var(--dim);font-size:12px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.on{opacity:.8;transition:none}
#view{touch-action:none;transform-origin:center center}
#adjBtn[aria-pressed="true"]{background:var(--accent);color:#0f380f;border-color:var(--accent)}
[hidden]{display:none!important}
/* Portrait: styles scroll sideways in one row */
#pals,#filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
#pals button,#filters button{flex:0 0 auto;white-space:nowrap}
#pals button.fav::before{content:'★ ';color:#f5e800}
/* Landscape: controls move to a side panel so the picture gets the full height */
@media (orientation: landscape) and (max-height: 600px) {
  body{flex-direction:row}
  #panel{width:46%;max-height:100%;border-top:0;border-left:1px solid var(--edge)}
}
</style>
</head>
<body>

  <div class="row" id="aspect"><button data-aspect="original" aria-pressed="false">Original</button><button data-aspect="4x3" aria-pressed="false">4:3</button><button data-aspect="3x2" aria-pressed="false">3:2</button><button data-aspect="16x9" aria-pressed="false">16:9</button><button data-aspect="3x4" aria-pressed="false">3:4</button><button data-aspect="2x3" aria-pressed="false">2:3</button><button data-aspect="9x16" aria-pressed="false">9:16</button></div>

  <input type="range" id="con" min="0.5" max="2" step="0.05" value="1">

    <button id="save" title="Save the current frame">Save PNG</button>  </div>
</div>
<video id="cam" playsinline muted autoplay style="display:none"></video>
<script>
// Hex helpers for the generated palettes
const hx = v => Math.round(v).toString(16).padStart(2, '0');
// Every combination of the given channel levels (3 levels give 27 colours, 4 levels give 64)
function grid(levels) {
  const out = [];
  for (const r of levels) for (const g of levels) for (const b of levels) out.push('#' + hx(r) + hx(g) + hx(b));
  return out;
}
// Hue, saturation and lightness (0-1) to hex
function hslHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return '#' + hx((r + m) * 255) + hx((g + m) * 255) + hx((b + m) * 255);
}
// Atari 2600 (NTSC): 16 hues in 8 brightness steps, with hue 0 as the grey row
function atariColours() {
  const out = [];
  for (let hue = 0; hue < 16; hue++) for (let lum = 0; lum < 8; lum++) {
    const l = 0.1 + lum * 0.11;
    out.push(hue === 0 ? hslHex(0, 0, l) : hslHex((hue - 1) * 360 / 15, 0.8, l * 0.9 + 0.05));
  }
  return out;
}

const PALETTES = {
  original: null,
  gameboy: {mode:'ramp', colours:['#0f380f','#306230','#8bac0f','#9bbc0f']},
  gbc: {mode:'nearest', colours:['#0f380f','#1e3a1e','#2f5a3a','#4a7a2a','#306230','#6fa040','#8bac0f','#b5d070','#9bbc0f','#d8f0a0','#3b2a1a','#5a3a2a','#6b4a2a','#8a5a3a','#9a6a3a','#c08a50','#b89070','#7a2a2a','#a04040','#c86a6a','#f0a0a0','#1a2a3a','#3a5a7a','#7aa0b8','#b8d0d8','#2a2a2a','#5a5a5a','#9a9a9a','#f0f0e0','#f0e0a0','#e8c8a8','#e8d880']},
  dos: {mode:'nearest', colours:['#000000','#0000aa','#00aa00','#00aaaa','#aa0000','#aa00aa','#aa5500','#aaaaaa','#555555','#5555ff','#55ff55','#55ffff','#ff5555','#ff55ff','#ffff55','#ffffff']},
  mono: {mode:'ramp', colours:['#000000','#ffffff']},
  nes: {mode:'nearest', colours:['#7c7c7c','#0000fc','#0000bc','#4428bc','#940084','#a80020','#a81000','#881400','#503000','#007800','#006800','#005800','#004058','#bcbcbc','#0078f8','#0058f8','#6844fc','#d800cc','#e40058','#f83800','#e45c10','#ac7c00','#00b800','#00a800','#00a844','#008888','#f8f8f8','#3cbcfc','#6888fc','#9878f8','#f878f8','#f85898','#f87858','#fca044','#f8b800','#b8f818','#58d854','#58f898','#00e8d8','#787878','#fcfcfc','#a4e4fc','#b8b8f8','#d8b8f8','#f8b8f8','#f8a4c0','#f0d0b0','#fce0a8','#f8d878','#d8f878','#b8f8b8','#b8f8d8','#00fcfc','#f8d8f8','#000000']},
  c64: {mode:'nearest', colours:['#000000','#ffffff','#68372b','#70a4b2','#6f3d86','#588d43','#352879','#b8c76f','#6f4f25','#433900','#9a6759','#444444','#6c6c6c','#9ad284','#6c5eb5','#959595']},
  zx: {mode:'zx', colours:['#000000','#0000cd','#cd0000','#cd00cd','#00cd00','#00cdcd','#cdcd00','#cdcdcd','#0000ff','#ff0000','#ff00ff','#00ff00','#00ffff','#ffff00','#ffffff']},
  pocket: {mode:'ramp', colours:['#000000','#555555','#aaaaaa','#ffffff']},
  cga: {mode:'nearest', colours:['#000000','#55ffff','#ff55ff','#ffffff']},
  pico8: {mode:'nearest', colours:['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa']},
  // Amstrad CPC: its 27 hardware colours are every mix of 0, half and full on each channel
  // Amiga OCS: a 32-colour set in the spirit of Workbench and the classic games
  amiga: {mode:'nearest', colours:['#000000','#ffffff','#aaaaaa','#555555','#3b67a2','#7ea0d8','#0a2a5a','#ff8800','#ffaa44','#884400','#cc2200','#ff6666','#00aa44','#66dd88','#005522','#aadd22','#dddd00','#886600','#2288cc','#44ccff','#0055aa','#aa44cc','#dd88ff','#552277','#cc6688','#ffccaa','#664433','#eeddbb','#88cc88','#336666','#ff3399','#33ccaa']},
  // Atari 2600: a 128-colour TIA palette, and the picture is limited to 160 px wide in drawFrame
  atari: {mode:'nearest', colours:atariColours()},
  // EGA: the 64-colour palette (2 bits per channel), unlike the 16-colour DOS set
  // Virtual Boy: four shades of red LED
  vb: {mode:'ramp', colours:['#000000','#4a0000','#a00000','#ff1a1a']},
  // Nokia 3310: four greys on the pale green LCD
  nokia: {mode:'ramp', colours:['#1d2a1d','#4d5e4a','#8a9a7c','#c4d2b0']},
  // Monochrome phosphor screens
  green: {mode:'ramp', colours:['#001400','#0f5a0f','#22aa22','#66ff66']},
  amber: {mode:'ramp', colours:['#140800','#663300','#cc7a00','#ffb000']}
};
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const B8 = [0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21];

// Colour filters: each maps brightness onto a gradient of colours, and works over any style.
// The colours were estimated by eye from the ZX Spectrum reference screenshot.
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function gradientLut(stops) {
  const cols = stops.map(hexRgb), lut = new Uint8ClampedArray(768);
  for (let L = 0; L < 256; L++) {
    const t = L / 255 * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(t)), f = t - i;
    for (let k = 0; k < 3; k++) lut[L * 3 + k] = Math.round(cols[i][k] + (cols[i+1][k] - cols[i][k]) * f);
  }
  return lut;
}
const FILTERS = {
  none: null,
  spectrum: gradientLut(['#000000', '#c020a0', '#20c8d8', '#f5e800']),
  alert: gradientLut(['#000000', '#5a0000', '#a01010', '#e02020', '#ff7040', '#ffe040', '#ffffff']),
  knight: gradientLut(['#000000', '#4a4a4a', '#9a9a9a', '#f2f2f2']),
  sunset: gradientLut(['#2a0a4a', '#e0457b', '#ff8c2a', '#fff0b0']),
  vaporwave: gradientLut(['#1a0838', '#8a2bb0', '#ff5fb4', '#5ff0ff', '#00d8f0', '#b8f8ff']),
  predator: gradientLut(['#06123a', '#1c5fc8', '#3ac0f0', '#48d060', '#f0e040', '#f07a20', '#e02424']),
  infrared: gradientLut(['#000000', '#5a0a2a', '#c81e1e', '#ffb4c8', '#ffffff']),
  neon: gradientLut(['#000000', '#008080', '#ff1493', '#ffffff']),
  sepia: gradientLut(['#2b1a0e', '#7a5230', '#c9a87a', '#f6ecd8']),
  blueprint: gradientLut(['#0a2a6a', '#2a5aa8', '#7aa8e0', '#ffffff']),
  riso: gradientLut(['#1a1a1a', '#2a7fff', '#ff48b0', '#f4efe6']),
  nightvision: gradientLut(['#000000', '#03260a', '#1a7a24', '#57ff5a', '#e8ffe8']),
  random: null // set by randomGradientLut() each time the button is tapped
};
FILTERS.random = randomGradientLut();
// Four random colours, sorted dark to light, so the gradient still reads from shadows to highlights
function randomGradientLut() {
  const stops = [0, 1, 2, 3].map(() => '#' + [0, 1, 2].map(() => Math.floor(Math.random() * 256).toString(16).padStart(2, '0')).join(''));
  stops.sort((a, b) => { const p = hexRgb(a), q = hexRgb(b); return (0.299*p[0] + 0.587*p[1] + 0.114*p[2]) - (0.299*q[0] + 0.587*q[1] + 0.114*q[2]); });
  return gradientLut(stops);
}
// Applies a filter in place, using each pixel's brightness
function applyFilter(d, lut) {
  for (let i = 0; i < d.length; i += 4) {
    const j = ((0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) | 0) * 3;
    d[i] = lut[j]; d[i+1] = lut[j+1]; d[i+2] = lut[j+2];
  }
}

const view = document.getElementById('view');
const vctx = view.getContext('2d', {willReadFrequently: true});
const cam = document.getElementById('cam');
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const res = document.getElementById('res');
const resLabel = document.getElementById('resLabel');
const ditherBtn = document.getElementById('dither');
const flipBtn = document.getElementById('flip');
const recBtn = document.getElementById('rec');
const saveBtn = document.getElementById('save');
const shootBtn = document.getElementById('shoot');
const flash = document.getElementById('flash');
const conEl = document.getElementById('con'), briEl = document.getElementById('bri'), satEl = document.getElementById('sat');

// Settings are remembered on this device when storage is available
const SAVED = (() => { try { return JSON.parse(localStorage.getItem('pixelcam') || '{}'); } catch (e) { return {}; } })();
let pal = SAVED.pal || 'gameboy', dither = SAVED.dither !== false, facing = SAVED.facing || 'environment';
let dirty = true; // a frozen photo is only reprocessed when this is set
let filterName = (SAVED.filter in FILTERS) ? SAVED.filter : 'none';
let filterLut = FILTERS[filterName];
// The resolution slider works in pixels for most styles and in text columns for the ASCII styles.
// Each mode remembers its own value.
const ASCII_COLS = {min: 20, max: 120, step: 10, def: 120};
const PX_RES = {min: 32, max: 768, step: 8, def: 160};
let resIsAsc = null, pxRes = +SAVED.res || 160, ascCols = +SAVED.asc || 120;
// Which characters the ASCII styles may use (set in getAtlas)
let asciiSet = SAVED.charset || 'all';
// Crop ratios for the picture. Original keeps the camera's own shape
const ASPECTS = {original: null, '4x3': 4 / 3, '3x2': 1.5, '16x9': 16 / 9, '3x4': 3 / 4, '2x3': 2 / 3, '9x16': 9 / 16};
let aspectKey = (SAVED.aspect in ASPECTS) ? SAVED.aspect : 'original';
// The part of the camera image to keep for the chosen ratio, centred
function cropFor(sw, sh) {
  const r = ASPECTS[aspectKey];
  if (!r) return {sx: 0, sy: 0, cw: sw, ch: sh, ratio: sw / sh};
  if (sw / sh > r) { const cw = sh * r; return {sx: (sw - cw) / 2, sy: 0, cw, ch: sh, ratio: r}; }
  const ch = sw / r; return {sx: 0, sy: (sh - ch) / 2, cw: sw, ch, ratio: r};
}if (SAVED.con) document.getElementById('con').value = SAVED.con;
if (SAVED.bri) document.getElementById('bri').value = SAVED.bri;
if (SAVED.sat) document.getElementById('sat').value = SAVED.sat;
// Show the restored values on the labels too
document.getElementById('conLabel').textContent = (+document.getElementById('con').value).toFixed(2);
document.getElementById('briLabel').textContent = document.getElementById('bri').value;
document.getElementById('satLabel').textContent = (+document.getElementById('sat').value).toFixed(2);
function writeSettings() {
  try { localStorage.setItem('pixelcam', JSON.stringify({
    pal, dither, facing, filter: filterName,
    res: resIsAsc ? pxRes : res.value, asc: resIsAsc ? res.value : ascCols,
    charset: asciiSet, aspect: aspectKey,
    con: conEl.value, bri: briEl.value, sat: satEl.value, favs: [...favs]
  })); } catch (e) {}
}
// Settings are written after a short pause, so dragging a slider doesn't write on every move
let persistTimer = 0;
function persist() {
  dirty = true;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(writeSettings, 300);
}
addEventListener('pagehide', () => { clearTimeout(persistTimer); writeSettings(); });

// Fall back to the default if the remembered palette no longer exists
if (![...document.querySelectorAll('#pals button')].some(b => b.dataset.pal === pal)) pal = 'gameboy';
// Reflect the remembered palette on the buttons (they are static in the HTML)
document.querySelectorAll('#pals button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.pal === pal)));

// Switch the resolution slider between pixels and columns when the style changes
function setResMode() {
  const a = pal === 'ascii' || pal === 'asciic' || pal === 'zzt';
  if (a === resIsAsc) return;
  if (resIsAsc === true) ascCols = +res.value; else if (resIsAsc === false) pxRes = +res.value;
  resIsAsc = a;
  const r = a ? ASCII_COLS : PX_RES;
  res.min = r.min; res.max = r.max; res.step = r.step;
  res.defaultValue = r.def; // double-tap reset goes back to this
  res.value = a ? ascCols : pxRes;
  resLabel.textContent = res.value + (a ? ' cols' : ' px wide');
  document.getElementById('sizes').style.display = a ? 'none' : ''; // pixel presets don't apply to columns
  document.getElementById('charsets').style.display = a && pal !== 'zzt' ? '' : 'none'; // character sets only apply to the ASCII styles
}
setResMode();

let stream = null, recorder = null, chunks = [];

  // Contrast, brightness, saturation, as adjust() does on the CPU
  vec3 r = (c - 128.0) * u_con + 128.0 + u_bri;
  float L = dot(r, lum3);

    int bi = int(mod(y, bs) * bs + mod(x, bs));

    for (int i = 0; i < 64; i++) { if (i == bi && u_dither == 1) t = u_mat[i]; }

    if (u_mode == 1) {
      float l = clamp((dot(c, lum3) / 255.0 - 0.5) * 1.15 + 0.5, 0.0, 1.0);
      int k = int(clamp(floor(l * float(u_n - 1) + t + 0.5), 0.0, float(u_n - 1)));
      pick = vec3(0.0);
      for (int i = 0; i < 64; i++) { if (i == k) pick = u_pal[i]; }
    } else {
      vec3 q = c + t * 90.0;
      float bd = 1e9;
      pick = u_pal[0];
      for (int i = 0; i < 64; i++) {
        if (i >= u_n) break;
        vec3 d = q - u_pal[i];
        float dd = dot(d, d);
        if (dd < bd) { bd = dd; pick = u_pal[i]; }
      }
    }
    col = pick / 255.0;
  }
  if (u_hasLut == 1) {
    float Lo = floor(dot(col * 255.0, lum3));

let gl = null, glProg = null, glCanvas = null, glTexImg = null, glTexLut = null;
const glLoc = {};
let glState = 'untried', glPalName = null, glBsize = 0, glLutSrc = null;
const glPalBuf = new Float32Array(192), glMatBuf = new Float32Array(64);
function glCompile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function glTexture() {

  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

}
function initGL() {
  glCanvas = document.createElement('canvas');
  gl = glCanvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
  if (!gl) return false;
  // If the GPU drops the context, the CPU path takes over
  glCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glState = 'failed'; });
  glProg = gl.createProgram();
  gl.attachShader(glProg, glCompile(gl.VERTEX_SHADER, GL_VS));
  gl.attachShader(glProg, glCompile(gl.FRAGMENT_SHADER, GL_FS));

  if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

  for (const n of ['u_img', 'u_lut', 'u_size', 'u_con', 'u_bri', 'u_sat', 'u_mode', 'u_n', 'u_pal', 'u_bsize', 'u_mat', 'u_dither', 'u_hasLut']) {

  glTexLut = glTexture();

}
// Which GPU mode the current style uses: 0 Original, 1 ramp, 2 nearest colour, -1 CPU only
function gpuMode() {
  if (pal === 'original') return 0;
  const P = PALETTES[pal];
  if (!P || pal === 'dos' || pal === 'zx' || pal === 'zxr' || P.rgb.length > 64) return -1;
  return P.mode === 'ramp' ? 1 : 2;
}
function gpuReady() {
  if (glState === 'untried') {

    catch (e) { glState = 'failed'; document.getElementById('inst').textContent = 'GPU off: ' + e.message; }

// Draws the processed picture from the view canvas (already scaled and mirrored), then writes the result back
function gpuFrame(w, h) {
  if (glCanvas.width !== w || glCanvas.height !== h) { glCanvas.width = w; glCanvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, glTexImg);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, view);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, glTexLut);
  if (filterLut && glLutSrc !== filterLut) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 256, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, filterLut);
    glLutSrc = filterLut;
  }
  const mode = gpuMode();
  gl.uniform2f(glLoc.u_size, w, h);
  gl.uniform1f(glLoc.u_con, +conEl.value);
  gl.uniform1f(glLoc.u_bri, +briEl.value);
  gl.uniform1f(glLoc.u_sat, +satEl.value);
  gl.uniform1i(glLoc.u_mode, mode);
  gl.uniform1i(glLoc.u_dither, dither ? 1 : 0);
  gl.uniform1i(glLoc.u_hasLut, filterLut ? 1 : 0);
  if (mode !== 0) {
    const list = PALETTES[pal].rgb;
    if (glPalName !== pal) {
      for (let k = 0; k < list.length; k++) { glPalBuf[k*3] = list[k][0]; glPalBuf[k*3+1] = list[k][1]; glPalBuf[k*3+2] = list[k][2]; }
      gl.uniform3fv(glLoc.u_pal, glPalBuf);
      glPalName = pal;
    }
    gl.uniform1i(glLoc.u_n, list.length);
    const bs = pal === 'mono' ? 8 : 4;
    if (glBsize !== bs) {

      for (let y = 0; y < bs; y++) for (let x = 0; x < bs; x++) {
        glMatBuf[y * bs + x] = bs === 8 ? B8[y * 8 + x] / 64 - 0.5 : BAYER[y * 4 + x] / 16 - 0.5;

// The loop always schedules the next frame, so one failed frame can't stop the picture for good
function frame() {
  try { drawFrame(); }
  catch (e) { document.getElementById('inst').textContent = 'Display error: ' + e.message; }
  requestAnimationFrame(frame);
}

function showMessage(text) {
  view.style.display = 'none';
  msg.style.display = 'flex';
  msg.innerHTML = '';
  const p = document.createElement('div');
  p.textContent = text;
  msg.appendChild(p);
  const b = document.createElement('button');
  b.textContent = 'Try again';
  b.style.marginTop = '12px';
  b.onclick = startCamera;
  msg.appendChild(b);
}

// Opens the camera straight away when the app loads
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  stream = null;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage('This browser cannot open the camera. Open the page over https in Safari or Chrome.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    cam.srcObject = stream;
    // If the system ends the camera while the page is open, start it again
    stream.getVideoTracks().forEach(t => { t.onended = () => startCamera(); });
    await cam.play();
  } catch (e) {
    showMessage('Camera unavailable (' + (e.name || 'error') + '). Allow camera access for this site and try again.');
  }
}

document.querySelectorAll('#pals button').forEach(b => b.addEventListener('click', () => {
  pal = b.dataset.pal;
  if (pal === 'zxr') newZxSeed(); // tapping the style again gives a new set of colours
  document.querySelectorAll('#pals button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  setResMode();
  persist();
}));

// Favourite styles: long-press a style to pin it to the front of the row
const favs = new Set(SAVED.favs || []);
function applyFavs() {
  const row = document.getElementById('pals');
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b => b.classList.toggle('fav', favs.has(b.dataset.pal)));
  btns.filter(b => favs.has(b.dataset.pal)).reverse().forEach(b => row.prepend(b));
}
applyFavs();
let holdTimer = 0, suppressClick = false;
const palRow = document.getElementById('pals');
palRow.querySelectorAll('button').forEach(b => {
  b.addEventListener('pointerdown', () => {
    suppressClick = false;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      suppressClick = true;
      if (favs.has(b.dataset.pal)) favs.delete(b.dataset.pal); else favs.add(b.dataset.pal);
      applyFavs();
      persist();
      if (navigator.vibrate) navigator.vibrate(15);
    }, 500);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(holdTimer)));
});
// The tap that ends a long press should not also pick the style
palRow.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); suppressClick = false; } }, true);

// Crop ratio for the picture
document.querySelectorAll('#aspect button').forEach(b => {
  b.setAttribute('aria-pressed', String(b.dataset.aspect === aspectKey));
  b.addEventListener('click', () => {
    aspectKey = b.dataset.aspect;
    document.querySelectorAll('#aspect button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    dirty = true; // a frozen picture is redrawn at the new ratio
    persist();
  });
});
// Character sets for the ASCII styles
document.querySelectorAll('#charsets button').forEach(b => {
  b.setAttribute('aria-pressed', String(b.dataset.set === asciiSet));
  b.addEventListener('click', () => {
    asciiSet = b.dataset.set;
    asciiAtlas = null; // rebuilt with the new characters on the next frame
    document.querySelectorAll('#charsets button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    dirty = true; // a frozen picture is redrawn with the new characters
    persist();
  });
});

// Preset pixel widths for the resolution slider
document.querySelectorAll('#sizes button').forEach(b => b.addEventListener('click', () => {
  res.value = b.dataset.size;
  res.dispatchEvent(new Event('input'));
}));

// Double-tap a slider to put it back to its default. Dragging does not count as a tap.
[res, conEl, briEl, satEl].forEach(el => {
  let startX = 0, startY = 0, lastTap = 0;
  el.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; });
  el.addEventListener('pointerup', e => {
    const still = Math.hypot(e.clientX - startX, e.clientY - startY) < 10;
    const now = Date.now();
    if (still && now - lastTap < 350) {
      el.value = el.defaultValue;
      el.dispatchEvent(new Event('input'));
      lastTap = 0;
    } else {
      lastTap = still ? now : 0;
    }
  });
});

document.querySelectorAll('#filters button').forEach(b => {
  b.setAttribute('aria-pressed', String(b.dataset.filter === filterName));
  b.addEventListener('click', () => {
    filterName = b.dataset.filter;
    if (filterName === 'random') FILTERS.random = randomGradientLut(); // a new gradient each time it is tapped
    filterLut = FILTERS[filterName];
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    persist();
  });
});

ditherBtn.setAttribute('aria-pressed', String(dither));
ditherBtn.textContent = 'Dither ' + (dither ? 'on' : 'off');
ditherBtn.addEventListener('click', () => {
  dither = !dither;
  ditherBtn.setAttribute('aria-pressed', String(dither));
  ditherBtn.textContent = 'Dither ' + (dither ? 'on' : 'off');
  persist();
});

res.addEventListener('input', () => { resLabel.textContent = res.value + (resIsAsc ? ' cols' : ' px wide'); persist(); });
document.getElementById('con').addEventListener('input', e => {
  document.getElementById('conLabel').textContent = (+e.target.value).toFixed(2); persist();
});
document.getElementById('bri').addEventListener('input', e => {
  document.getElementById('briLabel').textContent = e.target.value; persist();
});
document.getElementById('sat').addEventListener('input', e => {
  document.getElementById('satLabel').textContent = (+e.target.value).toFixed(2); persist();
});

flipBtn.addEventListener('click', () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  persist();
  startCamera();
});

// Collapsible adjustments: resolution and the colour sliders sit behind the Adjust button
const adjBtn = document.getElementById('adjBtn');
adjBtn.addEventListener('click', () => {
  const open = document.getElementById('adjust').hidden;
  document.getElementById('adjust').hidden = !open;
  adjBtn.setAttribute('aria-pressed', String(open));
  adjBtn.textContent = open ? 'Adjust ▴' : 'Adjust ▾';
});

// Pinch to zoom and drag to pan the picture; double-tap resets. Zoom changes only the display, not the saved picture.
let zoom = 1, panX = 0, panY = 0, pinchStart = null, lastTap = 0;
const pointers = new Map();
function applyZoom() {
  if (zoom === 1) { panX = 0; panY = 0; }
  view.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}
function startPinch() {
  const [a, b] = [...pointers.values()];
  pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom };
}
view.addEventListener('pointerdown', e => {
  view.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) startPinch();
  const now = Date.now();
  if (pointers.size === 1 && now - lastTap < 300) { zoom = 1; applyZoom(); }
  lastTap = now;
});
view.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoom = Math.min(4, Math.max(1, pinchStart.zoom * d / pinchStart.dist));
  } else if (pointers.size === 1 && zoom > 1) {
    panX += e.clientX - prev.x;
    panY += e.clientY - prev.y;
  }
  applyZoom();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  pinchStart = null;
  if (pointers.size === 2) startPinch();
}
view.addEventListener('pointerup', endPointer);
view.addEventListener('pointercancel', endPointer);

window.addEventListener('resize', fit);

function exportBlob() {
  // Pixel-perfect: the largest whole-number scale that fits 2160 px on the longest side, smoothing off,
  // so every picture pixel is an exact square block of the same size
  const s = Math.max(1, Math.floor(2160 / Math.max(view.width, view.height)));
  const out = document.createElement('canvas');
  out.width = view.width * s; out.height = view.height * s;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(view, 0, 0, out.width, out.height);
  return new Promise(r => out.toBlob(r, 'image/png'));
}

// Saves a file straight to the phone or computer (works because this page is hosted on its own site)
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// Saves the file as a download (Downloads folder on Android)
let lastVideo = null;
let reviewVid = null, reviewUrl = null;
const reviewBar = document.getElementById('reviewBar');
function saveFile(blob, name) {
  download(blob, name);
}
// After a recording stops, the clip plays in the feed until it is saved or discarded
function enterReview(blob, name) {
  exitReview();
  reviewUrl = URL.createObjectURL(blob);
  reviewVid = document.createElement('video');
  reviewVid.muted = true; reviewVid.loop = true; reviewVid.playsInline = true;
  reviewVid.src = reviewUrl;
  lastVideo = { blob, name };
  reviewBar.hidden = false;
  reviewVid.play().catch(() => {});
}
function exitReview() {
  if (reviewVid) { reviewVid.pause(); reviewVid = null; }
  if (reviewUrl) { URL.revokeObjectURL(reviewUrl); reviewUrl = null; }
  lastVideo = null;
  reviewBar.hidden = true;
}
document.getElementById('reviewSave').addEventListener('click', () => {
  if (!lastVideo) return;
  saveFile(lastVideo.blob, lastVideo.name);
  exitReview();
});
document.getElementById('reviewDiscard').addEventListener('click', exitReview);

function flashNow() {
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 120);
}

async function takePhoto() {
  if (!view.width) return;
  flashNow();
  const blob = await exportBlob();
  await saveFile(blob, `pixel-${pal}-${Date.now()}.png`);
}
shootBtn.addEventListener('click', toggleFreeze);
saveBtn.addEventListener('click', takePhoto);

// Briefly shows why recording is unavailable, then restores the Record label
function noVideo() {
  recBtn.textContent = 'No video';
  setTimeout(() => { if (!recorder) recBtn.textContent = 'Record'; }, 2000);
}

// Records the processed picture as the camera sees it; press again to stop and save
recBtn.addEventListener('click', () => {
  if (recorder) { recorder.stop(); return; }
  if (reviewVid) return;
  if (typeof MediaRecorder === 'undefined' || !view.captureStream) { noVideo(); return; }
  const opts = ['video/mp4', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!opts) { noVideo(); return; }
  const ext = opts.startsWith('video/mp4') ? 'mp4' : 'webm';
  chunks = [];
  try { recorder = new MediaRecorder(view.captureStream(30), { mimeType: opts }); }
  catch (e) { noVideo(); return; }
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  // If recording fails, free the recorder so the button works again
  recorder.onerror = () => {
    recorder = null;
    recBtn.textContent = 'Record';
    recBtn.classList.remove('rec-on');
    noVideo();
  };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: opts });
    recorder = null;
    recBtn.textContent = 'Record';
    recBtn.classList.remove('rec-on');
    enterReview(blob, `pixel-video-${Date.now()}.${ext}`);
  };
  recorder.start();
  recBtn.textContent = 'Stop';
  recBtn.classList.add('rec-on');
});

// Keep the screen awake while the camera is open where the browser allows it
// The lock is released whenever the page is hidden, so it is asked for again when the page comes back
async function keepAwake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);
// Phones stop the camera while the app is in the background. On return, start the camera again if it stopped.
// A frozen photo or an unsaved recording stays on screen, so nothing unsaved is lost.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const track = stream && stream.getVideoTracks()[0];
  if (!track || track.readyState !== 'live') startCamera();
  else if (cam.paused) cam.play().catch(() => {});
});

// Service worker lets the app open offline once it has been visited
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(updateInstall).catch(e => {
    document.getElementById('inst').textContent = 'Service worker failed: ' + e.message;
  });
  navigator.serviceWorker.addEventListener('controllerchange', updateInstall);
}

// Install check: shows which requirement is missing, and offers the browser's install prompt when it is ready
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updateInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; updateInstall(); });
document.getElementById('installBtn').addEventListener('click', () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(() => { deferredPrompt = null; updateInstall(); });
});
async function updateInstall() {
  const el = document.getElementById('inst');
  const btn = document.getElementById('installBtn');
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    el.textContent = 'Installed and running as an app.';
    btn.hidden = true;
    return;
  }
  const checks = [];
  checks.push(location.protocol === 'https:' ? 'https ok' : 'needs https');
  try {
    const m = await (await fetch('manifest.json', { cache: 'no-store' })).json();
    checks.push(m.icons && m.icons.length ? 'manifest ok' : 'manifest has no icons');
  } catch (e) { checks.push('manifest failed to load'); }
  checks.push(navigator.serviceWorker && navigator.serviceWorker.controller
    ? 'offline cache active'
    : 'offline cache not active yet (reload once)');
  checks.push(deferredPrompt ? 'install ready' : 'browser has not offered install');
  el.textContent = checks.join(' · ');
  btn.hidden = !deferredPrompt;
}
setTimeout(updateInstall, 2000);

startCamera();
requestAnimationFrame(frame);
</script>
