<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Cam">
<title>Pixel Cam</title>
<style>
:root{--bg:#0b0f0b;--panel:#121a12;--ink:#e6f2d2;--dim:#7a8c6a;--accent:#9bbc0f;--edge:#2c3a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#view{display:none;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
/* The controls: a scrolling panel with the shutter row fixed beneath it */
#controls{background:var(--panel);border-top:1px solid var(--edge);display:flex;flex-direction:column;max-height:62%}
#panel{padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;color:var(--ink);background:#1a241a;border:1px solid var(--edge);padding:8px 10px;border-radius:4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#0f380f;border-color:var(--accent)}
button.rec-on{background:#a02020;border-color:#a02020;color:#fff}
button:disabled{opacity:.4;cursor:default}
#shoot{width:66px;height:66px;border-radius:50%;background:var(--ink);border:4px solid var(--edge);padding:0}
#shoot:active{transform:scale(.94)}
#shoot.frozen{background:var(--accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dim{color:var(--dim);font-size:12px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.on{opacity:.8;transition:none}
#frame{position:relative;line-height:0;flex:0 0 auto;transform-origin:center center}
#fx{position:absolute;inset:0;width:100%;height:100%;display:none}
#stage{touch-action:none}
#adjBtn[aria-pressed="true"]{background:var(--accent);color:#0f380f;border-color:var(--accent)}
[hidden]{display:none!important}
#panel>*{flex-shrink:0} /* rows with their own sideways scroll must not collapse when the panel is short */
/* Filters scroll sideways in one row */
#filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
#filters button{flex:0 0 auto;white-space:nowrap}
/* Controls are centred and symmetrical */
.row{justify-content:center}
#adjust .row.spread{justify-content:center;gap:14px}
/* Pinned styles: all visible, wrapping and centred, with the drawer button centred beneath */
#favWrap{flex-direction:column;gap:8px}
/* Rows of buttons that scroll sideways, centred when they fit, with soft edges to show there is more */
#favBar,#sizes,#aspect,#charsets{display:flex;flex-wrap:nowrap;justify-content:safe center;gap:8px;width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overflow-anchor:none;padding:2px 14px;margin:0 -14px;width:calc(100% + 28px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
#favBar::-webkit-scrollbar,#sizes::-webkit-scrollbar,#aspect::-webkit-scrollbar,#charsets::-webkit-scrollbar{display:none}
#favBar button,#sizes button,#aspect button,#charsets button{flex:0 0 auto;white-space:nowrap}
#favBar:empty::before{content:'Long-press a style to pin it here';color:var(--dim);font-size:12px;margin:auto}
#favBar button.cur{border-style:dashed}
#openStyles{min-width:140px}
/* The style drawer: a centred sheet that slides up from the bottom */
#drawerBack{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;opacity:0;pointer-events:none;transition:opacity .25s}
#drawerBack.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:50%;bottom:0;z-index:20;width:min(100%,560px);background:var(--panel);border:1px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));max-height:78%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transform:translate(-50%,105%);transition:transform .25s ease}
#drawer.open{transform:translate(-50%,0)}
#drawerTabs{gap:0}
#drawerTabs button{min-width:110px;border-radius:0}
#drawerTabs button:first-child{border-radius:6px 0 0 6px}
#drawerTabs button:last-child{border-radius:0 6px 6px 0}
#pals{display:flex;flex-direction:column;gap:16px;width:100%}
#pals[hidden],#filters[hidden]{display:none}
.group{display:flex;flex-direction:column;gap:8px;align-items:center}
.group[hidden]{display:none}
.gname{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.grid,#filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.grid button,#filters button{white-space:nowrap;flex:0 0 calc(33.333% - 6px);padding:10px 4px;text-align:center}
#pals button.fav{display:none} /* pinned styles live in the bar */
#favBar button.fav::before{content:'★ ';color:#f5e800}
#closeStyles{min-width:140px}
#adjust{display:flex;flex-direction:column;gap:10px}
.adjsec{display:flex;flex-direction:column;gap:10px}
#adjTabs{gap:0}
#adjTabs button{min-width:84px;border-radius:0}
#adjTabs button:first-child{border-radius:6px 0 0 6px}
#adjTabs button:last-child{border-radius:0 6px 6px 0}
#styleName{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#000c;color:var(--ink);padding:6px 14px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;white-space:nowrap}
#styleName.on{opacity:1}
#backLive{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;background:#000c;border-radius:16px;padding:8px 16px;white-space:nowrap}
/* Seven crop ratios fit on one line */
/* Bottom row: two buttons, the shutter and two buttons, evenly spaced */
#bottomRow{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:8px;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--edge);flex:0 0 auto}
#bottomRow button{padding:0;height:44px;display:flex;align-items:center;justify-content:center}
#bottomRow #shoot{height:66px}
#rec .dot,#rec .stop{display:inline-flex}
#rec .dot{color:#e53030}
#rec .stop,#rec.rec-on .dot{display:none}
#rec.rec-on .stop{display:inline-flex}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;color:var(--ink);padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* Landscape: controls move to a side panel so the picture gets the full height */
@media (orientation: landscape) and (max-height: 600px) {
  body{flex-direction:row}
  #controls{width:54%;max-height:100%;border-top:0;border-left:1px solid var(--edge);flex-direction:row}
  /* The shutter row becomes a vertical strip on the outer edge, as on most phone cameras */
  #bottomRow{display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;width:84px;border-top:0;border-left:1px solid var(--edge);padding:8px 8px calc(8px + env(safe-area-inset-bottom));padding-right:calc(8px + env(safe-area-inset-right));overflow-y:auto}
  #bottomRow button{width:100%;flex:0 0 auto}
  #bottomRow #shoot{width:66px;height:66px;align-self:center}
}
</style>
</head>

<script>
// Hex helpers for the generated palettes
const hx = v => Math.round(v).toString(16).padStart(2, '0');
// Every combination of the given channel levels (3 levels give 27 colours, 4 levels give 64)
function grid(levels) {
  const out = [];
  for (const r of levels) for (const g of levels) for (const b of levels) out.push('#' + hx(r) + hx(g) + hx(b));
  return out;
}
// Hue, saturation and lightness (0-1) to hex
function hslHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return '#' + hx((r + m) * 255) + hx((g + m) * 255) + hx((b + m) * 255);
}
// Atari 2600 (NTSC): 16 hues in 8 brightness steps, with hue 0 as the grey row
function atariColours() {
  const out = [];
  for (let hue = 0; hue < 16; hue++) for (let lum = 0; lum < 8; lum++) {
    const l = 0.1 + lum * 0.11;
    out.push(hue === 0 ? hslHex(0, 0, l) : hslHex((hue - 1) * 360 / 15, 0.8, l * 0.9 + 0.05));
  }
  return out;
}

const PALETTES = {
  original: null,
  gameboy: {mode:'ramp', colours:['#0f380f','#306230','#8bac0f','#9bbc0f']},
  gbc: {mode:'nearest', colours:['#0f380f','#1e3a1e','#2f5a3a','#4a7a2a','#306230','#6fa040','#8bac0f','#b5d070','#9bbc0f','#d8f0a0','#3b2a1a','#5a3a2a','#6b4a2a','#8a5a3a','#9a6a3a','#c08a50','#b89070','#7a2a2a','#a04040','#c86a6a','#f0a0a0','#1a2a3a','#3a5a7a','#7aa0b8','#b8d0d8','#2a2a2a','#5a5a5a','#9a9a9a','#f0f0e0','#f0e0a0','#e8c8a8','#e8d880']},

// Opens the camera straight away when the app loads
let camToken = 0; // only the latest startCamera call may keep its stream
async function startCamera() {
  const token = ++camToken;
  if (stream) stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  stream = null;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage('This browser cannot open the camera. Open the page over https in Safari or Chrome.');
    return;
  }
  try {
    const st = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    if (token !== camToken) { st.getTracks().forEach(t => t.stop()); return; } // a newer call took over while this one waited
    stream = st;
    cam.srcObject = stream;
    // If the system ends the camera while the page is open, start it again
    stream.getVideoTracks().forEach(t => { t.onended = () => startCamera(); });
    await cam.play();
  } catch (e) {
    showMessage('Camera unavailable (' + (e.name || 'error') + '). Allow camera access for this site and try again.');
  }
}

// Pinch to zoom and drag to pan the picture; double-tap resets. Zoom changes only the display, not the saved picture.
let zoom = 1, panX = 0, panY = 0, pinchStart = null, lastTap = 0;
let swipe = null; // where a one-finger drag began, for swiping between styles
const pointers = new Map();
function applyZoom() {
  if (zoom === 1) { panX = 0; panY = 0; }
  frameEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}
function startPinch() {
  const [a, b] = [...pointers.values()];
  pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom };
}
// The whole stage listens, so swipes and pinches also work on the black area around the picture
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return; // the Back to live button keeps its own taps
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { startPinch(); swipe = null; }
  else if (pointers.size === 1) swipe = { x: e.clientX, y: e.clientY, t: Date.now() };
  const now = Date.now();
  if (pointers.size === 1 && now - lastTap < 300) { zoom = 1; applyZoom(); }
  lastTap = now;
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoom = Math.min(4, Math.max(1, pinchStart.zoom * d / pinchStart.dist));
  } else if (pointers.size === 1 && zoom === 1 && swipe) {
    // Dragging sideways steps through the styles as you go: one step for each 56 px, so a long drag keeps going
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (!swipe.vert && Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) swipe.vert = true; // mostly vertical: not a swipe
    if (!swipe.vert && Math.abs(dx) >= 56) { stepStyle(dx < 0 ? 1 : -1); swipe.x = e.clientX; swipe.y = e.clientY; }
  } else if (pointers.size === 1 && zoom > 1) {
    panX += e.clientX - prev.x;
    panY += e.clientY - prev.y;
  }

});
function endPointer(e) {
  swipe = null;
  pointers.delete(e.pointerId);
  pinchStart = null;
  if (pointers.size === 2) startPinch();
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

// ---- Screen effects: drawn by a small WebGL shader at screen size, over the low-res picture ----
// The picture is sampled in whole pixels, so it stays crisp. Effects: scanlines, phosphor mask, pixel grid, round pixels, bleed, glow, RGB split, vignette, film grain
const FX_VS = 'attribute vec2 a; varying vec2 v; void main() { v = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); gl_Position = vec4(a, 0.0, 1.0); }';
const FX_FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform sampler2D u_img;
uniform vec2 u_src;   // picture size in pixels
uniform vec2 u_out;   // output size in pixels
uniform float u_scan, u_vig, u_bloom, u_split, u_grid, u_mask, u_shape, u_bleed, u_chroma, u_grain, u_t;
vec3 pix(vec2 uv) { return texture2D(u_img, (floor(uv * u_src) + 0.5) / u_src).rgb; }
// The picture at a point, with the red and blue channels pulled apart by the RGB split
vec3 col(vec2 uv) {
  float off = u_split * 0.012;
  return vec3(pix(uv - vec2(off, 0.0)).r, pix(uv).g, pix(uv + vec2(off, 0.0)).b);
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + u_t * 43.7) * 43758.5453); }
void main() {
  vec2 uv = v;
  vec2 p0 = uv * 2.0 - 1.0;
  float sc = u_out.x / u_src.x; // output pixels per picture pixel
  vec3 c = col(uv);
  if (u_bleed > 0.0) {
    // Composite-video smear: each pixel's colour trails a few pixels to the right
    vec2 dx = vec2(1.0 / u_src.x, 0.0);
    vec3 smear = 0.4 * c + 0.25 * col(uv - dx) + 0.15 * col(uv - 2.0 * dx) + 0.1 * col(uv - 3.0 * dx) + 0.1 * col(uv + dx);
    c = mix(c, smear, u_bleed);
  }
  if (u_chroma > 0.0) {
    // Chroma smear: colour is stored at a lower resolution than brightness, so it spreads past edges while the detail stays sharp
    float span = 1.0 + 4.0 * u_chroma;
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 7; i++) acc += col(uv + vec2((float(i) - 3.0) / 3.0 * span, 0.0) / u_src);
    acc += col(uv + vec2(0.0, span * 0.5) / u_src) + col(uv - vec2(0.0, span * 0.5) / u_src);
    acc /= 9.0;
    float ly = dot(c, vec3(0.299, 0.587, 0.114)), la = dot(acc, vec3(0.299, 0.587, 0.114));
    c = mix(c, vec3(ly) + (acc - vec3(la)), u_chroma);
  }
  vec2 f = fract(uv * u_src);
  if (u_shape > 0.0) {
    // Round pixels: each picture pixel becomes a soft dot, with dark gaps between the dots
    float r = mix(0.72, 0.44, u_shape);
    float w = max(0.5 / sc, 0.03);
    float m = 1.0 - smoothstep(r - w, r + w, length(f - 0.5));
    c *= mix(1.0, m, clamp((sc - 1.5) / 2.5, 0.0, 1.0));
  }
  if (u_scan > 0.0) {
    // The lower part of each picture row is dark, like the gap between scanlines
    c *= 1.0 - u_scan * 0.6 * smoothstep(0.4, 1.0, f.y);
  }
  if (u_mask > 0.0) {
    // A phosphor mask: fine red, green and blue stripes across the screen
    float period = max(3.0, floor(u_out.x / 200.0));
    float ph = fract(v.x * u_out.x / period) * 3.0;
    vec3 tri = vec3(smoothstep(1.2, 0.2, abs(ph - 0.5)), smoothstep(1.2, 0.2, abs(ph - 1.5)), smoothstep(1.2, 0.2, abs(ph - 2.5)));
    c *= mix(vec3(1.0), (0.3 + 0.7 * tri) * 1.5, u_mask);
  }
  if (u_bloom > 0.0) {
    // Bright parts bleed light into their surroundings: a ring of soft samples, bright areas only
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 8; i++) {
      float a = float(i) * 0.7853982;
      vec2 d = vec2(cos(a), sin(a)) / u_src;
      acc += max(texture2D(u_img, uv + d * 3.0).rgb - 0.4, 0.0);
      acc += max(texture2D(u_img, uv + d * 7.0).rgb - 0.4, 0.0);
    }
    c += acc / 16.0 * u_bloom * 2.4;
  }
  if (u_grid > 0.0) {
    // Thin dark lines between the picture's pixels, fading out when the pixels are too small to show them
    vec2 dd = min(f, 1.0 - f);
    float lw = 0.55 / sc;
    float line = 1.0 - smoothstep(lw * 0.6, lw * 1.4 + 0.001, min(dd.x, dd.y));
    c *= 1.0 - u_grid * clamp((sc - 2.5) / 3.0, 0.0, 1.0) * line * 0.8;
  }
  c *= 1.0 - u_vig * 0.85 * smoothstep(0.35, 1.5, length(p0));
  if (u_grain > 0.0) {
    // Film grain: fresh noise every frame, strongest in the mid-tones, in grains about half a picture pixel across
    float cell = max(1.0, floor(sc * 0.5));
    float n = hash(floor(v * u_out / cell)) - 0.5;
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    c += n * u_grain * 0.45 * (1.0 - abs(l - 0.5));
  }
  gl_FragColor = vec4(c, 1.0);
}`;
// A renderer on the given canvas: render(picture, width, height, strengths) draws the picture with the effects at that size
function makeFx(canvas) {
  let g;
  try { g = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true }); } catch (e) { return null; }
  if (!g) return null;
  const sh = (type, src) => { const o = g.createShader(type); g.shaderSource(o, src); g.compileShader(o); if (!g.getShaderParameter(o, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(o)); return o; };
  let prog;
  try {
    prog = g.createProgram();
    g.attachShader(prog, sh(g.VERTEX_SHADER, FX_VS));
    g.attachShader(prog, sh(g.FRAGMENT_SHADER, FX_FS));
    g.linkProgram(prog);
    if (!g.getProgramParameter(prog, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(prog));
  } catch (e) { showNote('Screen effects off: ' + e.message); return null; }
  g.useProgram(prog);
  g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer());
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW);
  const a = g.getAttribLocation(prog, 'a');
  g.enableVertexAttribArray(a);
  g.vertexAttribPointer(a, 2, g.FLOAT, false, 0, 0);
  const loc = {};
  for (const n of ['u_img', 'u_src', 'u_out', 'u_scan', 'u_vig', 'u_bloom', 'u_split', 'u_grid', 'u_mask', 'u_shape', 'u_bleed', 'u_chroma', 'u_grain', 'u_t']) loc[n] = g.getUniformLocation(prog, n);
  const tex = g.createTexture();
  g.bindTexture(g.TEXTURE_2D, tex);
  for (const [k, v] of [[g.TEXTURE_MIN_FILTER, g.LINEAR], [g.TEXTURE_MAG_FILTER, g.LINEAR], [g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE], [g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE]]) g.texParameteri(g.TEXTURE_2D, k, v);
  g.uniform1i(loc.u_img, 0);
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fxBroken = true; });
  return {
    canvas,
    render(pic, W, H, P) {
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
      g.viewport(0, 0, W, H);
      g.bindTexture(g.TEXTURE_2D, tex);
      g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, g.RGBA, g.UNSIGNED_BYTE, pic);
      g.uniform2f(loc.u_src, pic.width, pic.height);
      g.uniform2f(loc.u_out, W, H);
      g.uniform1f(loc.u_scan, P.scan); g.uniform1f(loc.u_vig, P.vig);
      g.uniform1f(loc.u_bloom, P.bloom); g.uniform1f(loc.u_split, P.split); g.uniform1f(loc.u_grid, P.grid);
      g.uniform1f(loc.u_mask, P.mask); g.uniform1f(loc.u_shape, P.shape); g.uniform1f(loc.u_bleed, P.bleed); g.uniform1f(loc.u_chroma, P.chroma); g.uniform1f(loc.u_grain, P.grain);
      g.uniform1f(loc.u_t, Math.floor(performance.now() / 42) % 997); // the grain changes about 24 times a second
      g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
    }
  };
}
// Effects are off while a recorded clip is playing back, because the clip already has them
function fxActive() { return !fxBroken && !reviewVid && FX_DEFS.some(([k]) => fxParams[k] > 0); }
const fxCv = document.getElementById('fx');
let fxMain = null, fxExport = null;
const fxOutCv = document.createElement('canvas');
// Called after every frame: shows the effects overlay in place of the plain picture, or hides it when no effect is on
function fxPresent() {
  const on = fxActive() && view.style.display !== 'none' && view.width > 0;
  if (!on) {
    if (fxCv.style.display !== 'none') { fxCv.style.display = 'none'; view.style.visibility = ''; }
    return;
  }
  if (!fxMain) {
    fxMain = makeFx(fxCv);
    if (!fxMain) { fxBroken = true; document.getElementById('adjScreenTab').hidden = true; showAdjTab(adjTab); toast('Screen effects need WebGL'); return; }
  }
  // A live picture changes every frame; a frozen one only when something marks the overlay stale
  if (frozen && !fxStale) return;
  const cssW = parseFloat(view.style.width) || view.width, cssH = parseFloat(view.style.height) || view.height;
  const k = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(cssW * k), H = Math.round(cssH * k);
  const big = Math.max(W, H);
  if (big > 1600) { W = Math.round(W * 1600 / big); H = Math.round(H * 1600 / big); }
  fxMain.render(view, Math.max(1, W), Math.max(1, H), fxParams);
  fxCv.style.display = 'block';
  view.style.visibility = 'hidden';
  fxStale = false;
}
// The picture with the effects drawn at the given size (a canvas that stays valid until the next call), or null when none are on
function fxRenderTo(W, H) {
  if (!fxActive()) return null;
  if (!fxExport) fxExport = makeFx(document.createElement('canvas'));
  if (!fxExport) return null;
  fxExport.render(view, W, H, fxParams);
  return fxExport.canvas;
}

function exportBlob() {
  // Pixel-perfect: the largest whole-number scale that fits 2160 px on the longest side, smoothing off,
  // so every picture pixel is an exact square block of the same size
  const s = Math.max(1, Math.floor(2160 / Math.max(view.width, view.height)));
  const out = document.createElement('canvas');
  out.width = view.width * s; out.height = view.height * s;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(fxRenderTo(out.width, out.height) || view, 0, 0, out.width, out.height);
  return new Promise(r => out.toBlob(r, 'image/png'));
}

// Saves a file straight to the phone or computer (works because this page is hosted on its own site)
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

let lastVideo = null;
let reviewVid = null, reviewUrl = null;

// After a recording stops, the clip plays in the feed until it is saved or discarded
function enterReview(blob, name) {

  if (reviewVid) { reviewVid.pause(); reviewVid = null; }

// A short message at the bottom of the screen
let toastTimer = 0;

// Records the processed picture as the camera sees it; press again to stop and save
let recCv = null, recCtx = null, recRaf = 0;
// Copies the on-screen picture into the larger recording canvas once per display frame
function copyFrames() {
  const W = recCv.width, H = recCv.height;
  const same = view.width * H === view.height * W;
  let w = W, h = H;
  if (!same) {
    // The picture changed shape while recording (a new ratio or style): keep its proportions, centred on black
    const k = Math.min(W / view.width, H / view.height);
    w = view.width * k; h = view.height * k;
    recCtx.fillStyle = '#000';
    recCtx.fillRect(0, 0, W, H);
  }
  recCtx.drawImage(fxRenderTo(Math.max(1, Math.round(w)), Math.max(1, Math.round(h))) || view, (W - w) / 2, (H - h) / 2, w, h);
  recRaf = requestAnimationFrame(copyFrames);
}
function stopCopy() { cancelAnimationFrame(recRaf); recCv = null; recCtx = null; }
recBtn.addEventListener('click', () => {
  if (recorder) { recorder.stop(); return; }
  if (reviewVid) return;
  if (typeof MediaRecorder === 'undefined' || !view.captureStream) { noVideo(); return; }
  const opts = ['video/mp4', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!opts) { noVideo(); return; }
  const ext = opts.startsWith('video/mp4') ? 'mp4' : 'webm';
  // Record at a larger size than the on-screen picture, with each picture pixel a whole block (as in the photo export),
  // at a higher bitrate than the browser's default
  const s = Math.max(1, Math.floor(1080 / Math.max(view.width, view.height)));
  recCv = document.createElement('canvas');
  recCv.width = view.width * s; recCv.height = view.height * s;
  recCtx = recCv.getContext('2d');
  recCtx.imageSmoothingEnabled = false;
  chunks = [];
  try { recorder = new MediaRecorder(recCv.captureStream(30), { mimeType: opts, videoBitsPerSecond: 8000000 }); }
  catch (e) { recCv = null; noVideo(); return; }
  copyFrames();
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  // If recording fails, free the recorder so the button works again
  recorder.onerror = () => {
    stopCopy();
    recorder = null;
    recBtn.classList.remove('rec-on');
    noVideo();
  };
  recorder.onstop = () => {
    stopCopy();
    const blob = new Blob(chunks, { type: opts });
    recorder = null;
    recBtn.classList.remove('rec-on');
    if (!blob.size) { toast('Nothing was recorded'); return; }
    enterReview(blob, `pixel-video-${Date.now()}.${ext}`);
  };
  recorder.start();
  recBtn.classList.add('rec-on');
});

// Keep the screen awake while the camera is open where the browser allows it
// The lock is released whenever the page is hidden, so it is asked for again when the page comes back
async function keepAwake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);
// Phones stop the camera while the app is in the background. On return, start the camera again if it stopped.
// A frozen photo or an unsaved recording stays on screen, so nothing unsaved is lost.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const track = stream && stream.getVideoTracks()[0];
  if (!track || track.readyState !== 'live') startCamera();
  else if (cam.paused) cam.play().catch(() => {});
});

}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updateInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; updateInstall(); });
document.getElementById('installBtn').addEventListener('click', () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(() => { deferredPrompt = null; updateInstall(); });
});
// The install line is only shown for problems (showNote) or when the page is opened with ?debug
function showNote(text) { const el = document.getElementById('inst'); el.textContent = text; el.hidden = false; }
async function updateInstall() {
  const btn = document.getElementById('installBtn');
  // Inside the Android app, or once installed, there is nothing to install
  if (location.hostname === 'pixelcam.local' || matchMedia('(display-mode: standalone)').matches || navigator.standalone) { btn.hidden = true; return; }
  btn.hidden = !deferredPrompt;
  if (!/[?&]debug/.test(location.search)) return;
  const checks = [];
  checks.push(location.protocol === 'https:' ? 'https ok' : 'needs https');
  try {
    const m = await (await fetch('manifest.json', { cache: 'no-store' })).json();
    checks.push(m.icons && m.icons.length ? 'manifest ok' : 'manifest has no icons');
  } catch (e) { checks.push('manifest failed to load'); }
  checks.push(navigator.serviceWorker && navigator.serviceWorker.controller
    ? 'offline cache active'
    : 'offline cache not active yet (reload once)');
  checks.push(deferredPrompt ? 'install ready' : 'browser has not offered install');
  showNote(checks.join(' · '));
}
setTimeout(updateInstall, 2000);

startCamera();
requestAnimationFrame(frame);
</script>
